
name: Build Aetherion History APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AetherionHistoryAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q AetherionHistoryAndroid.zip -d extracted
          find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "No se encontró la estructura esperada del proyecto Android."
            echo "Contenido extraído:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Java and Kotlin compatibility
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cat > compatibility.gradle <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
              tasks.configureEach {
                  if (name.startsWith("compile") && name.endsWith("Kotlin")) {
                      try {
                          val options = this.javaClass
                              .getMethod("getKotlinOptions")
                              .invoke(this)
                          options.javaClass
                              .getMethod("setJvmTarget", String::class.java)
                              .invoke(options, "17")
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          GRADLE
          echo "Configuración de compatibilidad creada."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --init-script compatibility.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherionHistory-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
