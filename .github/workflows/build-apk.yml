
name: Build Aetherion History APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AetherionHistoryAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q AetherionHistoryAndroid.zip -d extracted

      - name: Configure Java and Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/AetherionHistoryAndroid/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"No se encontró el archivo: {p}")

          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              marker = "\n}\n\n\ndependencies"
              addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              if marker not in s:
                  raise SystemExit("No se encontró la ubicación esperada en app/build.gradle.kts")
              s = s.replace(marker, "\n" + addition + marker, 1)
              p.write_text(s)

          print(p.read_text())
          PY

      - name: Build APK
        run: gradle -p extracted/AetherionHistoryAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherionHistory-debug-apk
          path: extracted/AetherionHistoryAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
