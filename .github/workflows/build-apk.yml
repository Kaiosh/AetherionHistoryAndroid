
name: Build Aetherion History APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AetherionHistoryAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AetherionHistoryAndroid.zip -d .

      - name: Build debug APK
        run: gradle -p AetherionHistoryAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherionHistory-debug-apk
          path: AetherionHistoryAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
