name: Build Aetherion History APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AetherionHistoryAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q AetherionHistoryAndroid.zip -d extracted
          echo "Contenido extraído:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname || true)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró settings.gradle(.kts) en el zip extraído."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Detected Kotlin DSL app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Detected Groovy DSL app/build.gradle"
          else
            echo "::error::No se encontró app/build.gradle(.kts) en el proyecto."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Java and Kotlin targets
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f app/build.gradle.kts ]; then
            cat >> app/build.gradle.kts <<'KOTLIN'

            tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                sourceCompatibility = "17"
                targetCompatibility = "17"
            }

            tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            KOTLIN
            echo "Compatibilidad Java/Kotlin configurada en app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            cat >> app/build.gradle <<'GROOVY'

            tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
            }

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
            GROOVY
            echo "Compatibilidad Java/Kotlin configurada en app/build.gradle"
          else
            echo "::error::No se encontró app/build.gradle ni app/build.gradle.kts"
            exit 1
          fi

      - name: Ensure Gradle wrapper exists and is executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            echo "Using existing gradlew"
            chmod +x ./gradlew
          else
            echo "No gradlew found — generating wrapper using the system gradle"
            gradle wrapper --gradle-version 8.9 || { echo "gradle wrapper failed"; exit 1; }
            chmod +x ./gradlew
          fi

      - name: Show Gradle & Java versions
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "=== java --version ==="
          java --version || true
          echo "=== gradle --version ==="
          gradle --version || true
          echo "=== ./gradlew --version ==="
          ./gradlew --version || true

      - name: Build debug APK (wrapper + detailed logs)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info > build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload Gradle build log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ steps.project.outputs.dir }}/build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherionHistory-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
